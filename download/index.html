<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download CoachCupid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #2D1F4E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .logo { font-size: 40px; color: #7C5CBF; font-weight: 800; margin-bottom: 8px; }
    .title { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-apple { background: #000; color: #fff; }
    .btn-google { background: #fff; color: #2D1F4E; }
    .divider { font-size: 12px; color: rgba(255,255,255,0.3); margin: 4px 0 16px; }
    .site { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 24px; }
  </style>
  <script>
    // Auto-redirect based on device
    function getDevice() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(ua)) return 'android';
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
      return 'unknown';
    }

    window.onload = function() {
      const device = getDevice();
      if (device === 'ios') {
        window.location.href = 'https://apps.apple.com/app/coachcupid/id6791794008';
      } else if (device === 'android') {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.coachcupid.app';
      }
      // If unknown (desktop), show both buttons below
    };
  </script>
</head>
