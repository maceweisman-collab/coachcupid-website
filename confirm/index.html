<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming your CoachCupid account...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #2D1F4E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .logo { font-size: 32px; color: #7C5CBF; font-weight: 800; margin-bottom: 24px; }
    .title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; }
    .sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: block;
      width: 100%;
      background: #7C5CBF;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #7C5CBF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6b6b; font-size: 14px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✦ CoachCupid</div>
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">Confirming your account...</div>
    <div class="sub" id="sub">Opening CoachCupid for you now.</div>
    <div class="error" id="error"></div>
    <a href="#" class="btn" id="openBtn" style="display:none">Open CoachCupid</a>
  </div>
 
  <script>
    function getParams() {
      // Check both hash and query string
      const hash = window.location.hash.substring(1);
      const query = window.location.search.substring(1);
      const params = {};
      
      const parseStr = (str) => {
        str.split('&').forEach(pair => {
          const [key, val] = pair.split('=');
          if (key) params[decodeURIComponent(key)] = decodeURIComponent(val || '');
        });
      };
      
      if (hash) parseStr(hash);
      if (query) parseStr(query);
      return params;
    }
 
    function showFallback(deepLink) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Email confirmed!';
      document.getElementById('sub').textContent = 'Tap the button below to open CoachCupid and complete your setup.';
      const btn = document.getElementById('openBtn');
      btn.href = deepLink;
      btn.style.display = 'block';
    }
 
    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Something went wrong';
      document.getElementById('sub').textContent = 'Please try registering again in the CoachCupid app.';
      const err = document.getElementById('error');
      err.textContent = msg;
      err.style.display = 'block';
    }
 
    window.onload = function() {
      const params = getParams();
      
      // Check for errors
      if (params.error) {
        showError(params.error_description || 'Confirmation failed. Please try again.');
        return;
      }
 
      // Build deep link with all params
      const paramStr = Object.entries(params)
        .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
        .join('&');
 
      const deepLink = `coachcupid:///confirm?${paramStr}`;
 
      // Try to open the app
      window.location.href = deepLink;
 
      // Show fallback button after 2 seconds if app didn't open
      setTimeout(() => {
        showFallback(deepLink);
      }, 2000);
    };
  </script>
</body>
</html>
