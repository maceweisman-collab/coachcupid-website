<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoachCupid - Confirming your account</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #2D1F4E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .logo { font-size: 32px; color: #7C5CBF; font-weight: 800; margin-bottom: 24px; }
    .title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; }
    .sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: block;
      width: 100%;
      background: #7C5CBF;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-gold { background: #FFD700; color: #2D1F4E; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #7C5CBF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✦ CoachCupid</div>
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">Confirming your email...</div>
    <div class="sub" id="sub">Please wait while we verify your account.</div>
    <div id="buttons" style="display:none"></div>
  </div>
 
  <script>
    function parseParams() {
      const params = {};
      // Check hash first (Supabase uses hash for tokens)
      const hash = window.location.hash.substring(1);
      // Check query string too
      const query = window.location.search.substring(1);
      
      const parse = (str) => {
        str.split('&').forEach(pair => {
          const idx = pair.indexOf('=');
          if (idx > -1) {
            const key = decodeURIComponent(pair.substring(0, idx));
            const val = decodeURIComponent(pair.substring(idx + 1));
            params[key] = val;
          }
        });
      };
      
      if (hash) parse(hash);
      if (query) parse(query);
      return params;
    }
 
    function showSuccess(deepLink) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Email confirmed!';
      document.getElementById('sub').textContent = 'Tap below to open CoachCupid and complete your profile setup.';
      const btns = document.getElementById('buttons');
      btns.style.display = 'block';
      btns.innerHTML = `<a href="${deepLink}" class="btn btn-gold">Open CoachCupid</a>`;
    }
 
    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Link expired';
      document.getElementById('sub').textContent = 'This confirmation link has expired. Please open CoachCupid and register again.';
    }
 
    window.onload = function() {
      const params = parseParams();
      console.log('Params:', JSON.stringify(params));
      
      if (params.error) {
        showError(params.error_description || 'Something went wrong.');
        return;
      }
 
      // Build the deep link with all params
      const token_hash = params.token_hash;
      const access_token = params.access_token;
      const refresh_token = params.refresh_token;
      const type = params.type || 'signup';
 
      let deepLink;
      
      if (token_hash) {
        // New PKCE flow
        deepLink = `coachcupid://confirm?token_hash=${encodeURIComponent(token_hash)}&type=${encodeURIComponent(type)}`;
      } else if (access_token) {
        // Legacy flow
        deepLink = `coachcupid://confirm?access_token=${encodeURIComponent(access_token)}&refresh_token=${encodeURIComponent(refresh_token || '')}&type=${encodeURIComponent(type)}`;
      } else {
        showError('Invalid confirmation link.');
        return;
      }
 
      // Try to open app automatically
      window.location.href = deepLink;
 
      // Show button after 1.5s as fallback
      setTimeout(() => {
        showSuccess(deepLink);
      }, 1500);
    };
  </script>
</body>
</html>
